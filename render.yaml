services:
  - type: web
    name: send-receive-drop-service
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_CONTENT_LENGTH_MB
        value: 200
      - key: DROP_EXPIRY_HOURS
        value: 24
      - key: RENDER
        value: true
